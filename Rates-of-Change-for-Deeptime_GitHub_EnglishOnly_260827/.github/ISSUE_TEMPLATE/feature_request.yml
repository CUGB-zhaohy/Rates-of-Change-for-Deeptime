name: Feature request
description: Suggest a scientific or usability improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Scientific or user problem
      description: Explain the workflow limitation that motivates the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe inputs, outputs, expected behaviour, and validation criteria.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Methods or references
      description: Add relevant equations, publications, or comparable software.
  - type: dropdown
    id: scope
    attributes:
      label: Main area
      options:
        - Data input and preprocessing
        - RoC calculation
        - Scale correction
        - Method evaluation
        - Breakpoints and phases
        - Plotting and export
        - GUI and packaging
        - Documentation
    validations:
      required: true
