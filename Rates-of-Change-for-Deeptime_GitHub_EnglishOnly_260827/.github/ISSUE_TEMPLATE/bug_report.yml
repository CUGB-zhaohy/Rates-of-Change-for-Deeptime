name: Bug report
description: Report a reproducible software problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove sensitive data and attach only the smallest reproducible example."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.0.1
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Windows executable / GUI
        - Python GUI
        - Python command line
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11; packaged executable, or Python 3.11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the configuration and the smallest safe input example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and log
      description: Paste the relevant error and run-summary text.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks completed
      options:
        - label: I ran the dry-run check or validated the GUI settings.
          required: true
        - label: I confirmed that the report contains no confidential data.
          required: true
