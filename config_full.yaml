# Deeptime RoC Analysis configuration file

project:
  name: "Deeptime RoC Analysis"

input:
  file: "data/O.xlsx"
  sheet: 0
  age_column: "Age"
  value_column: "Value"

output:
  directory: "outputs"

timebin:
  start_age_kyr: 67000
  end_age_kyr: 0
  resolution_kyr: 10
  widths_kyr:
    - 50
    - 100
    - 150
    - 200
    - 250
    - 300
    - 350
    - 400
    - 450
    - 500
    - 550
    - 600
    - 650
    - 700
    - 750
    - 800
    - 850
    - 900
    - 950
    - 1000

methods:
  run_ibr: true
  run_ts: true
  run_iqr: true
  theilsen_alpha: 0.90
  # IQR quartile calculation method:
  # "inc" = inclusive quartile, equivalent to Excel QUARTILE.INC / PERCENTILE.INC
  iqr_quartile_method: "inc"
  iqr_min_count: 2

interpolation:
  # Internal gaps use the nearest valid bin on each side only.
  method: "weighted"
  count_weight_alpha: 1.0
  distance_weight_beta: 1.0
  edge_mode: "nearest"

analysis:
  run_lri: true
  run_metrics: true
  run_pwlf: true
  run_kde: true
  run_phase: true
  run_plotting: true

lri:
  quantile_levels: [25, 50, 75]

metrics:
  age_tolerance_relative: 0.001

breakpoint:
  data_type: time_scale_corrected_relative
  age_min_kyr: 0
  age_max_kyr: 67100
  segments: [5, 6, 7, 8, 9, 10]
  half_window_kyr: 1000
  min_points: 8
  alpha: 0.05

kde:
  age_col: Breakpoint_kyr
  confidence_col: Confidence
  significant_col: Significant
  significant_only: true
  fallback_to_all_if_empty: true
  use_confidence_weight: true
  age_min_kyr: 0
  age_max_kyr: 67100
  grid_step_kyr: 10
  bandwidth_kyr: 1000
  min_prominence_fraction: 0.05
  min_distance_kyr: 1000
  top_n_peaks: 6

phase:
  age_min_kyr: 0
  age_max_kyr: 67100
  breakpoint_col: Consensus_breakpoint_kyr
  sort_breakpoints: true
  min_phase_width_kyr: 0
  classification_labels:
    - Maximum
    - High
    - Moderate
    - Transitional
    - Reduced
    - Low
    - Minimal

plotting:
  enabled: true
  figure_formats: ["svg", "png"]
  dpi: 600
  age_min_kyr: 0
  age_max_kyr: 67100

preprocess:
  sort_by_age: true
  use_zscore: false
  zscore_column: "Z_score"
  save_preprocessed: true
